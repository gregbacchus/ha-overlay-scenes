activate_set:
  name: Activate Overlay Set
  description: Activate every opted-in non-condition layer in an Overlay Set.
  fields:
    config_entry_id:
      name: Overlay Set
      description: Select the Overlay Set to activate.
      required: true
      selector:
        config_entry:
          integration: overlay_scenes

deactivate_set:
  name: Deactivate Overlay Set
  description: Deactivate every opted-in non-condition layer in an Overlay Set.
  fields:
    config_entry_id:
      name: Overlay Set
      description: Select the Overlay Set to deactivate.
      required: true
      selector:
        config_entry:
          integration: overlay_scenes

activate_layer:
  name: Activate layer
  description: Activate or refresh one configured layer.
  fields:
    layer_entity_id:
      name: Layer
      description: Select the layer status entity to activate.
      required: true
      selector:
        entity:
          filter:
            integration: overlay_scenes
            domain: sensor
            device_class: enum
    duration_override:
      name: Duration override
      required: false
      selector:
        duration:

deactivate_layer:
  name: Deactivate layer
  description: Deactivate one configured layer.
  fields:
    layer_entity_id:
      name: Layer
      description: Select the layer status entity to deactivate.
      required: true
      selector:
        entity:
          filter:
            integration: overlay_scenes
            domain: sensor
            device_class: enum
