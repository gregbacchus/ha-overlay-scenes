activate_set:
  name: Activate Overlay Set
  description: Activate every opted-in non-condition layer in an Overlay Set.
  fields:
    config_entry_id:
      name: Overlay Set
      description: Select the Overlay Set to activate.
      required: false
      selector:
        config_entry:
          integration: overlay_scenes
    legacy_ids:
      name: Legacy YAML identifiers
      collapsed: true
      fields:
        overlay_set_id:
          name: Overlay Set ID
          description: Qualified ID retained for existing automations. Prefer Overlay Set above.
          required: false
          selector:
            text:

deactivate_set:
  name: Deactivate Overlay Set
  description: Deactivate every opted-in non-condition layer in an Overlay Set.
  fields:
    config_entry_id:
      name: Overlay Set
      description: Select the Overlay Set to deactivate.
      required: false
      selector:
        config_entry:
          integration: overlay_scenes
    legacy_ids:
      name: Legacy YAML identifiers
      collapsed: true
      fields:
        overlay_set_id:
          name: Overlay Set ID
          description: Qualified ID retained for existing automations. Prefer Overlay Set above.
          required: false
          selector:
            text:

activate_layer:
  name: Activate layer
  description: Activate or refresh one configured layer using its Overlay Set-qualified reference.
  fields:
    layer_entity_id:
      name: Layer
      description: Select the layer status entity to activate.
      required: false
      selector:
        entity:
          filter:
            integration: overlay_scenes
            domain: sensor
            device_class: enum
    duration_override:
      name: Duration override
      required: false
      selector:
        duration:
    legacy_ids:
      name: Legacy YAML identifiers
      collapsed: true
      fields:
        layer_id:
          name: Layer reference
          description: Qualified set.layer ID retained for existing automations. Prefer Layer above.
          required: false
          selector:
            text:

deactivate_layer:
  name: Deactivate layer
  description: Deactivate one configured layer using its Overlay Set-qualified reference.
  fields:
    layer_entity_id:
      name: Layer
      description: Select the layer status entity to deactivate.
      required: false
      selector:
        entity:
          filter:
            integration: overlay_scenes
            domain: sensor
            device_class: enum
    legacy_ids:
      name: Legacy YAML identifiers
      collapsed: true
      fields:
        layer_id:
          name: Layer reference
          description: Qualified set.layer ID retained for existing automations. Prefer Layer above.
          required: false
          selector:
            text:
